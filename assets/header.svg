<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fattah Widjaya Gandhi. SQA Engineer, QA Automation, Web, Mobile and API Testing.">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252a32"/>
      <stop offset="1" stop-color="#1b1f25"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0" r="0.7">
      <stop offset="0" stop-color="#7fd1bd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7fd1bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="0.6">
      <stop offset="0" stop-color="#efb889" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#efb889" stop-opacity="0"/>
    </radialGradient>
    <filter id="raise" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="10" dy="12" stdDeviation="12" flood-color="#06080c" flood-opacity="0.6"/>
      <feDropShadow dx="-6" dy="-6" stdDeviation="10" flood-color="#ffffff" flood-opacity="0.04"/>
    </filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="4" dy="5" stdDeviation="5" flood-color="#06080c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="#1e2228"/>
  <rect width="1200" height="300" rx="28" fill="url(#glowA)"/>
  <rect width="1200" height="300" rx="28" fill="url(#glowB)"/>

  <g filter="url(#raise)">
    <rect x="36" y="34" width="1128" height="232" rx="26" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.06"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(84 88)">
      <rect x="0" y="-10" width="18" height="2.5" rx="1.25" fill="#7fd1bd" opacity="0.8"/>
      <text x="30" y="-3" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" letter-spacing="2.2" fill="#7fd1bd">SQA ENGINEER &#183; JAKARTA</text>
    </g>
    <text x="84" y="150" font-size="52" font-weight="700" fill="#eef1f6" letter-spacing="-0.8">Fattah Widjaya Gandhi</text>
    <text x="84" y="192" font-size="21" font-weight="500" fill="#9ba4b3">QA Automation &#183; Web, Mobile &amp; API Testing</text>
    <text x="84" y="226" font-size="16" fill="#8a93a2">Side project: Studio Director at Lawak Studio (Roblox)</text>
  </g>

  <g font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="600">
    <g filter="url(#soft)">
      <rect x="884" y="84" width="236" height="44" rx="22" fill="#22272e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="884" y="140" width="236" height="44" rx="22" fill="#22272e" stroke="#ffffff" stroke-opacity="0.06"/>
      <rect x="884" y="196" width="236" height="44" rx="22" fill="#22272e" stroke="#ffffff" stroke-opacity="0.06"/>
    </g>
    <circle cx="910" cy="106" r="5" fill="#7fd1bd"/>
    <text x="926" y="111" fill="#dde2ea">Playwright</text>
    <circle cx="910" cy="162" r="5" fill="#7fd1bd"/>
    <text x="926" y="167" fill="#dde2ea">Bruno &#183; API tests</text>
    <circle cx="910" cy="218" r="5" fill="#efb889"/>
    <text x="926" y="223" fill="#dde2ea">Roblox Studio</text>
  </g>
</svg>
